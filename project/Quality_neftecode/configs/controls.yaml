# Все теги — STATE по умолчанию. Управлять можно только теми, что перечислены.
controls:
  hyd_t6:
    min: 340.0
    max: 385.0
    step: 1.0
    max_delta: 5.0
    unit: degC
  hyd_f9:
    min: 170.0
    max: 270.0
    step: 2.0
    max_delta: 10.0
    unit: t/h
  hyd_p13:
    min: 3.6
    max: 4.1
    step: 0.02
    max_delta: 0.10
    unit: MPa

# T6/F9/P13 подтверждены как управляющие теги. Диапазоны и шаги выше —
# экспериментальные модельные границы, а не утвержденный операторный регламент.
