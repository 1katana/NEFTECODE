[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neftecode-orchestrator"
version = "0.1.0"
description = "Fail-closed decision orchestrator for the Neftecode multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.scripts]
neftecode-orchestrator = "neftecode_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neftecode_orchestrator = ["py.typed"]
