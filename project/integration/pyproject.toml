[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neftecode-integration"
version = "0.1.0"
description = "Composition root and HTTP API for the Neftecode hackathon system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "python-multipart>=0.0.20,<1",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "quality-agent",
    "neftecode-optimization",
    "neftecode-orchestrator",
    "neftecode-reliability-agent",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
neftecode-api = "neftecode_integration.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
quality-agent = { workspace = true }
neftecode-optimization = { workspace = true }
neftecode-orchestrator = { workspace = true }
neftecode-reliability-agent = { workspace = true }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/../Quality_neftecode",
    "$MYPY_CONFIG_FILE_DIR/../orchestrator/src",
    "$MYPY_CONFIG_FILE_DIR/../neftecode_optimizer",
    "$MYPY_CONFIG_FILE_DIR/..",
]

[[tool.mypy.overrides]]
module = ["quality_agent.*"]
follow_imports = "skip"
ignore_missing_imports = true
