[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neftecode-optimization"
version = "0.1.0"
description = "Deterministic candidate generation, safety filtering, and ranking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
neftecode-opt = "optimization.cli:main"

[tool.setuptools]
packages = ["optimization"]

[tool.setuptools.package-data]
optimization = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
