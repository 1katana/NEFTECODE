[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neftecode-reliability-agent"
version = "1.0.0"
description = "Local process-regime reliability assessment"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[tool.setuptools]
packages = ["reliability_agent"]
package-dir = {reliability_agent = "."}

[tool.setuptools.package-data]
reliability_agent = ["artifacts/model.joblib", "policy.json", "schema.json"]
